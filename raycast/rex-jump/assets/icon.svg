<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34304f"/>
      <stop offset="1" stop-color="#1c1a2c"/>
    </linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6bdf5"/>
      <stop offset="1" stop-color="#9d7fd6"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2b47"/>
      <stop offset="1" stop-color="#26233a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- side panes, each with an agent status dot -->
  <rect x="80" y="84" width="158" height="164" rx="30" fill="url(#pane)" stroke="#47407d" stroke-width="4"/>
  <circle cx="118" cy="122" r="14" fill="#f6c177"/>
  <rect x="80" y="268" width="158" height="160" rx="30" fill="url(#pane)" stroke="#47407d" stroke-width="4"/>
  <circle cx="118" cy="306" r="14" fill="#569fba"/>

  <!-- target pane -->
  <rect x="262" y="84" width="170" height="344" rx="34" fill="#c4a7e7" opacity="0.55" filter="url(#glow)"/>
  <rect x="262" y="84" width="170" height="344" rx="34" fill="url(#target)"/>

  <!-- jump arrow -->
  <path d="M302 300 L392 210 M326 206 H396 V276" fill="none" stroke="#232136" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
